# Emplacement de chaque rôle technique dans <architecture> (vocabulaire : skills/integrations/roles.conf). À ADAPTER.
# Format : role :: segment de package(s), séparés par des virgules (relatif à la feature) :: précision
entrant-http :: controller :: appelle le service de la feature
entrant-messagerie :: listener :: consommateur, appelle le service de la feature (comme un contrôleur)
entrant-mcp :: mcp :: outil MCP, appelle le service de la feature
sortant-persistance :: repository :: Spring Data, appelé uniquement par le service
sortant-cache :: cache :: appelé uniquement par le service
sortant-messagerie :: publisher :: appelé uniquement par le service
sortant-fichiers :: storage :: appelé uniquement par le service
sortant-notification :: notification :: appelé uniquement par le service
sortant-http :: client :: appelé uniquement par le service
