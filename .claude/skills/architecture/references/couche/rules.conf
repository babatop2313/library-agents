# Règles d'import interdites, vérifiées par .claude/hooks/guard-architecture.sh après chaque écriture d'un .java.
# Contrôle rapide ; ArchitectureTest (ArchUnit) reste la référence.
#
# Format : <segment de chemin> :: <regex sur les lignes d'import> :: <message renvoyé à Claude>
#  - le segment est cherché dans le chemin du fichier, sous src/main/java/ (ex. "controller" → .../controller/...)
#  - lignes vides et lignes commençant par # ignorées
controller :: ^import (static )?[a-z0-9_.]+\.(repository|entity|mapper)\.[A-Z] :: un contrôleur n'appelle que des services et ne manipule que des DTO (ni repository, ni entité, ni mapper).
mcp :: ^import (static )?[a-z0-9_.]+\.(repository|entity|mapper)\.[A-Z] :: un outil MCP, comme un contrôleur, n'appelle que des services et ne manipule que des DTO.
listener :: ^import (static )?[a-z0-9_.]+\.(repository|entity|mapper)\.[A-Z] :: un consommateur de messages, comme un contrôleur, n'appelle que des services et ne manipule que des DTO.
service :: ^import (static )?(org\.springframework\.web\.|org\.springframework\.http\.ResponseEntity|jakarta\.servlet\.|[a-z0-9_.]+\.controller\.) :: un service ne connaît ni HTTP ni les contrôleurs : il lève des exceptions métier.
repository :: ^import (static )?[a-z0-9_.]+\.(service|controller|dto|mapper)\.[A-Z] :: un repository ne dépend que des entités.
entity :: ^import (static )?([a-z0-9_.]+\.(service|controller|repository|dto|mapper)\.[A-Z]|org\.springframework\.web\.) :: une entité ne dépend d'aucune autre couche.
mapper :: ^import (static )?[a-z0-9_.]+\.(controller|service|repository)\.[A-Z] :: un mapper ne convertit qu'entre entités et DTO.
