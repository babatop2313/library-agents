# Emplacement de chaque rôle technique dans l'architecture hexagonale (vocabulaire : skills/integrations/roles.conf).
# Format : role :: segment de package(s), séparés par des virgules (relatif au module) :: précision
entrant-http :: adapter/in/web :: contrôleur REST, appelle un port d'entrée
entrant-messagerie :: adapter/in/messaging :: consommateur, appelle un port d'entrée (comme un contrôleur)
entrant-mcp :: adapter/in/mcp :: outil MCP, appelle un port d'entrée
sortant-persistance :: adapter/out/persistence :: implémente un port de sortie
sortant-cache :: adapter/out/cache :: implémente un port de sortie (ou décore l'adapter de persistance)
sortant-messagerie :: adapter/out/messaging :: implémente un port de sortie de publication d'événements
sortant-fichiers :: adapter/out/storage :: implémente un port de sortie de stockage
sortant-notification :: adapter/out/notification :: implémente un port de sortie de notification
sortant-http :: adapter/out/http :: implémente un port de sortie vers l'API externe
