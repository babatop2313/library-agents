# Règles d'import interdites, vérifiées par .claude/hooks/guard-architecture.sh après chaque écriture d'un .java.
# Contrôle rapide ; ArchitectureTest (ArchUnit) reste la référence.
#
# Format : <segment de chemin> :: <regex sur les lignes d'import> :: <message renvoyé à Claude>
#  - le segment est cherché dans le chemin du fichier, sous src/main/java/ (ex. "domain" → .../domain/...)
#  - lignes vides et lignes commençant par # ignorées
domain :: ^import (static )?(org\.springframework|jakarta\.persistence|jakarta\.validation|lombok|[a-z0-9_.]+\.(application|adapter|config)\.) :: le domaine reste en Java pur (ni Spring, ni JPA, ni Jakarta Validation, ni Lombok, ni import application/adapter/config).
application :: ^import (static )?(jakarta\.persistence|org\.springframework\.(web|data)|[a-z0-9_.]+\.(adapter|config)\.) :: l'application ne dépend que du domaine et de ses ports (ni adapter, ni config, ni JPA, ni Spring Web/Data).
adapter/in :: ^import (static )?[a-z0-9_.]+\.(adapter\.out|application\.usecase|application\.port\.out)\. :: un adapter entrant n'appelle qu'un port d'entrée (interface de use case).
adapter/out :: ^import (static )?[a-z0-9_.]+\.(adapter\.in|application\.usecase|application\.port\.in)\. :: un adapter sortant implémente un port de sortie et ne déclenche pas de use case.
