# Règles de l'intégration, appliquées par guard-architecture.sh quand elle est active dans stack.json.
# Format : roles :: regex :: message
# Un fichier Java qui contient une ligne correspondant à la regex n'est accepté que dans un package d'un des rôles
# (clés de skills/integrations/roles.conf, séparées par des virgules) ou dans un package « config ».
# Exemple :
# sortant-cache :: ^import (static )?org\.exemple\.client\. :: <Nom> ne s'utilise que dans l'adapter de cache ou la configuration.
