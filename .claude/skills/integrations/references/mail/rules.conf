# Règles appliquées par guard-architecture.sh quand l'intégration est active dans stack.json.
# Format : roles :: regex :: message (voir skills/integrations/SKILL.md). Les packages « config » sont toujours autorisés.
sortant-notification :: ^import (static )?(org\.springframework\.mail|jakarta\.mail)\. :: l'envoi de mail ne se fait que dans le rôle de notification ou la configuration ; le domaine exprime une intention via un port.
