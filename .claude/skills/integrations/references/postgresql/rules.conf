# Règles appliquées par guard-architecture.sh quand l'intégration est active dans stack.json.
# Format : roles :: regex :: message (voir skills/integrations/SKILL.md). Les packages « config » sont toujours autorisés.
sortant-persistance :: ^import (static )?(jakarta\.persistence|org\.springframework\.data\.jpa|org\.hibernate)\. :: JPA et Hibernate ne s'utilisent que dans le rôle de persistance (entités, repositories, adapter) ou la configuration.
