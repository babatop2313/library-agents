# Règles appliquées par guard-architecture.sh quand l'intégration est active dans stack.json.
# Format : roles :: regex :: message (voir skills/integrations/SKILL.md). Les packages « config » sont toujours autorisés.
sortant-cache :: ^import (static )?(org\.springframework\.data\.redis|io\.lettuce)\. :: Redis ne s'utilise que dans le rôle de cache ou la configuration ; le domaine et les cas d'utilisation passent par un port.
sortant-cache,sortant-persistance :: ^[[:space:]]*@(Cacheable|CacheEvict|CachePut|Caching)([^A-Za-z]|$) :: les annotations de cache ne vont que sur un adapter de cache ou de persistance, jamais sur le domaine ni sur un cas d'utilisation.
