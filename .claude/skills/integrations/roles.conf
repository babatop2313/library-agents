# Vocabulaire des rôles techniques (source unique).
# Chaque référence d'architecture dit OÙ va chaque rôle (references/<architecture>/roles.conf).
# Chaque référence d'intégration dit QUELS rôles elle joue (section « Rôle dans l'architecture » et rules.conf).
# Format : role :: description
entrant-http :: point d'entrée HTTP (contrôleur REST)
entrant-messagerie :: consommateur de messages (Kafka, RabbitMQ…)
entrant-mcp :: outil MCP exposé à un assistant IA
sortant-persistance :: accès à la base de données
sortant-cache :: lecture et écriture dans un cache (Redis…)
sortant-messagerie :: publication de messages ou d'événements
sortant-fichiers :: stockage de fichiers (S3, MinIO, disque)
sortant-notification :: envoi de notifications (mail, SMS…)
sortant-http :: appel d'une API externe (client HTTP)
