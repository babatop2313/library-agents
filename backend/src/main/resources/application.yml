spring:
  application:
    name: library
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USER}          # secret : aucune valeur par défaut, démarrage refusé si absent
    password: ${DB_PASSWORD}      # secret : aucune valeur par défaut, démarrage refusé si absent
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # le schéma est géré uniquement par Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:                        # cache partagé (rôle sortant-cache) ; jamais la source de vérité
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD} # secret : aucune valeur par défaut (peut être vide en local)
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s                 # délai maximal d'une commande
      connect-timeout: 2s
  jackson:
    deserialization:
      accept-float-as-int: false  # "copies": 2.5 est refusé au lieu d'être tronqué
  mvc:
    problemdetails:
      enabled: true               # erreurs au format RFC 9457
  ai:
    mcp:
      server:                     # serveur MCP du catalogue (outils en lecture seule)
        name: library-catalog
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        annotation-scanner:
          enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET}       # secret : aucune valeur par défaut, démarrage refusé si absent ; au moins 32 octets
      ttl: ${JWT_TTL:PT1H}        # durée du jeton et du cookie (ISO-8601)
      cookie-name: ACCESS_TOKEN
    bcrypt:
      strength: 10
  bootstrap:
    librarian:                    # premier bibliothécaire créé au démarrage s'il n'en existe aucun ; jamais de valeur par défaut
      email: ${BOOTSTRAP_LIBRARIAN_EMAIL:}
      password: ${BOOTSTRAP_LIBRARIAN_PASSWORD:}
  cache:
    ttl:
      default: 10m                # TTL obligatoire sur chaque clé Redis, par type de donnée si besoin

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
