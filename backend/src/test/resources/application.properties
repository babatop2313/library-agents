# Valeurs utilisées UNIQUEMENT par les tests.
# Ce fichier .properties est chargé en plus du application.yml principal et le complète :
# il fournit les variables d'environnement attendues, sans secret réel.
# La base de données des tests est fournie par Testcontainers (voir PostgresTestcontainersConfiguration).
JWT_SECRET=test-only-secret-key-not-for-production-0123456789
# Testcontainers remplace la vraie connexion : ces valeurs ne satisfont que les placeholders et la vérification de démarrage.
DB_USER=test
DB_PASSWORD=test
# Redis des tests fourni par Testcontainers (sans mot de passe) ; @ServiceConnection remplace host/port.
REDIS_PASSWORD=
