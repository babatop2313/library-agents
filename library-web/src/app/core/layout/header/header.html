<header class="app-header d-flex align-items-center gap-3 gap-md-4 px-3 px-md-4 py-3">
  <a routerLink="/" class="app-title d-flex align-items-center gap-2">
    <i class="pi pi-book" aria-hidden="true"></i>
    <span>Bibliothèque</span>
  </a>

  @let current = user();
  @if (current) {
    <nav aria-label="Navigation principale">
      <a
        routerLink="/catalogue"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="app-nav-link"
        >Catalogue</a
      >
    </nav>
    <div class="ms-auto d-flex align-items-center gap-2 gap-md-3">
      <span class="app-user d-none d-sm-inline">{{ current.email ?? 'Utilisateur connecté' }}</span>
      @for (role of current.roles; track role) {
        <p-tag styleClass="d-none d-sm-inline-flex" [value]="label(role)" [severity]="severity(role)" />
      }
      <p-button
        label="Se déconnecter"
        icon="pi pi-sign-out"
        ariaLabel="Se déconnecter"
        styleClass="app-logout"
        severity="secondary"
        size="small"
        [loading]="loggingOut()"
        [disabled]="loggingOut()"
        (onClick)="logout()"
      />
    </div>
  }
</header>
