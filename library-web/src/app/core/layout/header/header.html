<header class="app-header d-flex align-items-center px-4 py-3">
  <a routerLink="/" class="app-title d-flex align-items-center gap-2">
    <i class="pi pi-book" aria-hidden="true"></i>
    <span>Bibliothèque</span>
  </a>

  @let current = user();
  @if (current) {
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="app-user">{{ current.email ?? 'Utilisateur connecté' }}</span>
      @for (role of current.roles; track role) {
        <p-tag [value]="label(role)" [severity]="severity(role)" />
      }
      <p-button
        label="Se déconnecter"
        icon="pi pi-sign-out"
        severity="secondary"
        size="small"
        [loading]="loggingOut()"
        [disabled]="loggingOut()"
        (onClick)="logout()"
      />
    </div>
  }
</header>
